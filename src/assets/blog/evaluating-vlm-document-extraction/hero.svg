<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating VLM document extraction</title>
  <desc id="desc">Messy PDFs and schemas flow through a production-like extractor into graders and a shipping decision.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7e0d4" stroke-width="1" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#314455" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #f7f1e8; }
      .card { fill: #fffaf1; stroke: #314455; stroke-width: 3; rx: 22; }
      .blue { fill: #d9ecff; }
      .green { fill: #dff5df; }
      .yellow { fill: #fff0bf; }
      .pink { fill: #ffe0df; }
      .ink { fill: #203040; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font-size: 47px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #5c6670; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 18px; fill: #5c6670; }
      .arrow { fill: none; stroke: #314455; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="630" class="bg"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="70" y="96" class="ink title">Evaluating VLM document extraction</text>
  <text x="73" y="139" class="ink subtitle">The useful output is not a leaderboard. It is a decision you can defend.</text>

  <rect x="72" y="240" width="220" height="130" class="card blue"/>
  <text x="104" y="294" class="ink label">PDFs</text>
  <text x="104" y="326" class="ink small">unknown location</text>
  <text x="104" y="352" class="ink small">unknown format</text>

  <rect x="352" y="240" width="220" height="130" class="card yellow"/>
  <text x="384" y="294" class="ink label">Schema</text>
  <text x="384" y="326" class="ink small">known fields</text>
  <text x="384" y="352" class="ink small">missing is possible</text>

  <rect x="632" y="224" width="230" height="162" class="card green"/>
  <text x="664" y="285" class="ink label">Extractor</text>
  <text x="664" y="317" class="ink small">production path</text>
  <text x="664" y="343" class="ink small">raw + parsed output</text>

  <rect x="922" y="224" width="230" height="162" class="card pink"/>
  <text x="954" y="282" class="ink label">Decision</text>
  <text x="954" y="316" class="ink small">promote, block,</text>
  <text x="954" y="342" class="ink small">investigate, tune</text>

  <path d="M292 305 C316 305 326 305 352 305" class="arrow"/>
  <path d="M572 305 C598 305 608 305 632 305" class="arrow"/>
  <path d="M862 305 C890 305 894 305 922 305" class="arrow"/>

  <text x="74" y="520" class="ink small">Layers: ground truth · code graders · LLM judge · human calibration · cost/latency · failure taxonomy</text>
</svg>
